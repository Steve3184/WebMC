plugins {
    id 'java'
}

group = 'top.steve3184.webmc'
version = '1.0.0'

// Dependencies managed centrally in root settings.gradle via dependencyResolutionManagement

dependencies {
    implementation 'org.teavm:teavm-jso:0.13.1'
    implementation 'org.teavm:teavm-jso-apis:0.13.1'
    implementation project(':mcp')
}

// NOTE: JDK stub compilation is handled centrally in the root build.gradle.
// blaze3d-impl only needs --patch-module flags to compile against those stubs.
compileJava {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.compilerArgs = [
        '--patch-module', "java.base=$rootDir/../addons/jdk-stubs/locks",
        '--patch-module', "jdk.unsupported=$rootDir/../addons/jdk-stubs/sun-misc",
        '--patch-module', "java.base=$rootDir/../addons/jdk-stubs/jdk-extra",
    ]
}
