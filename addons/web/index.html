<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMC</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#canvas-container{position:absolute;top:0;left:0;width:100%;height:100%}
#game-canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important;display:block;image-rendering:pixelated}
#boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:#1a1a2e;color:#fff;font-family:monospace}
#boot.hidden{display:none}
#boot-title{font-size:28px;font-weight:700;margin-bottom:16px;text-shadow:0 0 10px rgba(255,255,255,.3)}
#boot-status{font-size:16px;margin-bottom:8px;min-height:22px}
#boot-progress{width:280px;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-bottom:12px}
#boot-progress div{height:100%;background:#4ade80;width:0%;transition:width .3s ease}
#boot-hint{font-size:13px;opacity:.7}
#boot-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);color:#ff6b6b;font-family:monospace;font-size:14px;text-align:center;padding:40px;white-space:pre-wrap}
#boot-error.show{display:flex}
/* Chat UI Styles */
#chat-container{position:absolute;bottom:0;left:0;right:0;pointer-events:none;font-family:monospace;font-size:14px;color:#fff;text-shadow:1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000}
#chat-container.hidden{display:none}
#chat-messages{max-height:180px;overflow:hidden;padding:8px 10px 4px 10px}
#chat-messages:empty{padding:0}
.chat-message{margin-bottom:2px;line-height:1.4;word-wrap:break-word;transition:opacity 0.2s}
.chat-message .sender{font-weight:bold}
.chat-message .timestamp{font-size:11px;opacity:0.6;margin-right:4px}
.chat-message.system{color:#aaa;font-style:italic}
.chat-message.info{color:#4ade80}
.chat-message.warning{color:#fbbf24}
.chat-message.error{color:#f87171}
.chat-message.sent{color:#93c5fd}
.chat-message:hover{opacity:1}
#chat-input-container{display:none;pointer-events:auto;padding:4px 10px 8px 10px}
#chat-input-container.visible{display:block}
#chat-input-container input{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;font-family:monospace;font-size:14px;outline:none;border-radius:4px}
#chat-input-container input::placeholder{color:rgba(255,255,255,.5)}
#chat-input-container input:focus{border-color:rgba(255,255,255,.6);background:rgba(0,0,0,.7)}
#chat-hint{position:absolute;bottom:4px;left:10px;color:rgba(255,255,255,.5);font-size:12px;pointer-events:none;display:none}

/* Multiplayer Menu Styles */
#multiplayer-menu{display:none;position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:auto;background:linear-gradient(180deg,rgba(10,14,20,.85),rgba(0,0,0,.92));color:#fff;font-family:monospace;z-index:100}
#multiplayer-menu.show{display:flex}
#multiplayer-menu .panel{background:rgba(30,40,55,.95);border:2px solid #555;border-radius:8px;padding:24px;width:min(600px,90vw);max-height:90vh;overflow-y:auto}
#multiplayer-menu h2{font-size:24px;margin:0 0 16px 0;text-align:center;text-shadow:0 2px 0 #111}
.server-list{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;border:1px solid #444;border-radius:4px;background:rgba(0,0,0,.3)}
.server-list:empty::before{content:"No servers added";display:block;padding:20px;text-align:center;color:#888}
.server-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #333;cursor:pointer;transition:background .15s}
.server-item:last-child{border-bottom:none}
.server-item:hover{background:rgba(255,255,255,.08)}
.server-item.selected{background:rgba(74,222,128,.15);border-left:3px solid #4ade80}
.server-item .status{width:10px;height:10px;border-radius:50%;margin-right:12px;flex-shrink:0}
.server-item .status.online{background:#4ade80;box-shadow:0 0 6px #4ade80}
.server-item .status.offline{background:#666}
.server-item .status.pending{background:#fbbf24;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.server-item .info{flex:1;min-width:0}
.server-item .name{font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-item .address{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-item .players{font-size:11px;color:#888;margin-top:2px}
.server-item .ping{font-size:11px;padding:2px 6px;border-radius:3px;margin-left:8px}
.server-item .ping.good{background:rgba(74,222,128,.2);color:#4ade80}
.server-item .ping.medium{background:rgba(251,191,36,.2);color:#fbbf24}
.server-item .ping.bad{background:rgba(248,113,113,.2);color:#f87171}
.server-item .ping.none{background:rgba(100,100,100,.2);color:#888}
.menu-buttons{display:flex;gap:10px;margin-top:16px}
.menu-buttons button{flex:1;height:40px;border:2px solid #1b1b1b;background:#777;color:#fff;font:700 14px monospace;text-shadow:1px 1px 0 #111;box-shadow:inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(0,0,0,.35);cursor:pointer;border-radius:4px}
.menu-buttons button:hover{background:#8d8d8d}
.menu-buttons button.primary{background:#4ade80;color:#000;text-shadow:none}
.menu-buttons button.primary:hover{background:#5eed91}
.menu-buttons button.danger{background:#dc2626;color:#fff}
.menu-buttons button.danger:hover{background:#ef4444}

/* Direct Connect Dialog */
#direct-connect{display:none;position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:auto;background:rgba(0,0,0,.7);z-index:101}
#direct-connect.show{display:flex}
#direct-connect .dialog{background:rgba(30,40,55,.98);border:2px solid #555;border-radius:8px;padding:24px;width:min(400px,90vw)}
#direct-connect h3{font-size:18px;margin:0 0 16px 0;text-align:center}
#direct-connect .field{margin-bottom:12px}
#direct-connect label{display:block;font-size:12px;color:#aaa;margin-bottom:4px}
#direct-connect input{width:100%;padding:10px 12px;background:rgba(0,0,0,.4);border:1px solid #555;border-radius:4px;color:#fff;font-family:monospace;font-size:14px;box-sizing:border-box}
#direct-connect input:focus{outline:none;border-color:#4ade80}

/* Connection Status */
#connection-status{position:absolute;top:10px;right:10px;padding:6px 12px;background:rgba(0,0,0,.6);border-radius:4px;font-size:12px;color:#888;pointer-events:none;display:none}
#connection-status.show{display:block}
#connection-status.connected{color:#4ade80}
#connection-status.connecting{color:#fbbf24}
#connection-status.error{color:#f87171}

/* Resource Pack Menu Styles */
#resourcepack-menu{display:none;position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:auto;background:linear-gradient(180deg,rgba(10,14,20,.85),rgba(0,0,0,.92));color:#fff;font-family:monospace;z-index:100}
#resourcepack-menu.show{display:flex}
#resourcepack-menu .panel{background:rgba(30,40,55,.95);border:2px solid #555;border-radius:8px;padding:24px;width:min(550px,90vw);max-height:90vh;overflow-y:auto}
#resourcepack-menu h2{font-size:22px;margin:0 0 16px 0;text-align:center;text-shadow:0 2px 0 #111;display:flex;align-items:center;justify-content:space-between}
#resourcepack-menu h2 button{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:0 4px}
#resourcepack-menu h2 button:hover{color:#fff}
.pack-list{list-style:none;margin:0;padding:0;max-height:350px;overflow-y:auto;border:1px solid #444;border-radius:4px;background:rgba(0,0,0,.3)}
.pack-list:empty::before{content:"No resource packs added";display:block;padding:20px;text-align:center;color:#888}
.pack-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #333;gap:12px;transition:background .15s}
.pack-item:last-child{border-bottom:none}
.pack-item:hover{background:rgba(255,255,255,.06)}
.pack-item.disabled{opacity:.5}
.pack-item .drag-handle{cursor:grab;color:#555;font-size:14px;padding:4px}
.pack-item .drag-handle:active{cursor:grabbing}
.pack-item input[type="checkbox"]{width:18px;height:18px;accent-color:#4ade80;cursor:pointer}
.pack-item .pack-icon{width:40px;height:40px;background:linear-gradient(135deg,#4a5568,#2d3748);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pack-item .pack-info{flex:1;min-width:0}
.pack-item .pack-name{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pack-item .pack-meta{font-size:11px;color:#888;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.pack-item .pack-meta span{display:flex;align-items:center;gap:3px}
.pack-item .pack-meta .warning{color:#fbbf24}
.pack-item .pack-meta .error{color:#f87171}
.pack-item .pack-actions{opacity:0;transition:opacity .15s}
.pack-item:hover .pack-actions{opacity:1}
.pack-item .pack-actions button{background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.pack-item .pack-actions button:hover{background:rgba(255,255,255,.2)}
.pack-item .pack-actions button.danger:hover{background:rgba(220,38,38,.4)}
.pack-add-section{margin-top:16px;display:flex;gap:8px}
.pack-add-section input[type="text"]{flex:1;padding:10px 12px;background:rgba(0,0,0,.4);border:1px solid #555;border-radius:4px;color:#fff;font-family:monospace;font-size:13px}
.pack-add-section input[type="text"]::placeholder{color:#666}
.pack-add-section input[type="text"]:focus{outline:none;border-color:#4ade80}
.pack-add-section button{padding:10px 16px;border:2px solid #1b1b1b;background:#4a5568;color:#fff;font:700 13px monospace;border-radius:4px;cursor:pointer}
.pack-add-section button:hover{background:#5a6578}
.pack-add-section button.primary{background:#4ade80;color:#000;border-color:#4ade80}
.pack-add-section button.primary:hover{background:#5eed91}
.pack-actions-bar{display:flex;gap:8px;margin-top:16px}
.pack-actions-bar button{flex:1;height:38px;border:2px solid #1b1b1b;background:#777;color:#fff;font:700 13px monospace;border-radius:4px;cursor:pointer}
.pack-actions-bar button:hover{background:#8d8d8d}
.pack-actions-bar button.primary{background:#4ade80;color:#000;border-color:#4ade80}
.pack-actions-bar button.primary:hover{background:#5eed91}
.pack-progress{margin-top:12px;display:none}
.pack-progress.show{display:block}
.pack-progress .bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.pack-progress .bar div{height:100%;background:#4ade80;width:0%;transition:width .2s}
.pack-progress .status{font-size:12px;color:#888;margin-top:4px;text-align:center}
</style>
</head>
<body>
<script>
// Early canvas resize - runs before any game scripts
(function() {
    var canvas = document.getElementById('game-canvas');
    if (canvas) {
        canvas.width = window.innerWidth || 1280;
        canvas.height = window.innerHeight || 720;
    }
})();
</script>
<canvas id="game-canvas" width="1280" height="720"></canvas>
<div id="boot">
<div id="boot-title">WebMC</div>
<div id="boot-status">Loading...</div>
<div id="boot-progress"><div></div></div>
<div id="boot-hint"></div>
<div id="boot-error"></div>
</div>
<!-- Chat UI -->
<div id="chat-container" class="hidden">
<div id="chat-messages"></div>
<div id="chat-input-container">
<input type="text" id="chat-input" placeholder="Press Enter to send..." maxlength="256" autocomplete="off" spellcheck="false">
</div>
</div>

<!-- Multiplayer Menu -->
<div id="multiplayer-menu">
<div class="panel">
<h2>Multiplayer</h2>
<ul class="server-list" id="server-list"></ul>
<div class="menu-buttons">
<button id="btn-direct-connect">Direct Connect</button>
<button id="btn-add-server">Add Server</button>
<button id="btn-refresh">Refresh</button>
<button id="btn-join" class="primary" disabled>Join Server</button>
<button id="btn-back">Back</button>
</div>
</div>
</div>

<!-- Direct Connect Dialog -->
<div id="direct-connect">
<div class="dialog">
<h3>Connect to Server</h3>
<div class="field">
<label>Server Address</label>
<input type="text" id="dc-address" placeholder="localhost:8080" autocomplete="off">
</div>
<div class="menu-buttons">
<button id="dc-connect" class="primary">Connect</button>
<button id="dc-cancel">Cancel</button>
</div>
</div>
</div>

<!-- Connection Status -->
<div id="connection-status"></div>

<!-- Resource Pack Menu -->
<div id="resourcepack-menu">
<div class="panel">
<h2>
<span>Resource Packs</span>
<button id="rp-close" title="Close">&times;</button>
</h2>
<ul class="pack-list" id="pack-list"></ul>
<div class="pack-add-section">
<input type="file" id="rp-file-input" accept=".zip,.mcpack" style="display:none">
<button id="rp-add-local" class="primary">Add Pack</button>
<input type="text" id="rp-url-input" placeholder="Or enter pack URL...">
<button id="rp-add-url">Add URL</button>
</div>
<div class="pack-progress" id="rp-progress">
<div class="bar"><div></div></div>
<div class="status">Loading...</div>
</div>
<div class="pack-actions-bar">
<button id="rp-reload" class="primary">Reload Packs</button>
<button id="rp-clear">Clear All</button>
</div>
</div>
</div>
<script src="vfs.js"></script>
<script src="resourcepack-bridge.js"></script>
<script src="socket.js"></script>
<script src="multiplayer.js"></script>
<script src="bootstrap.js"></script>
<script src="game.js"></script>
</body>
</html>
