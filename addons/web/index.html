<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMC</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#canvas-container{position:absolute;top:0;left:0;width:100%;height:100%}
#game-canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important;display:block;image-rendering:pixelated}
#boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:#1a1a2e;color:#fff;font-family:monospace}
#boot.hidden{display:none}
#boot-title{font-size:28px;font-weight:700;margin-bottom:16px;text-shadow:0 0 10px rgba(255,255,255,.3)}
#boot-status{font-size:16px;margin-bottom:8px;min-height:22px}
#boot-progress{width:280px;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-bottom:12px}
#boot-progress div{height:100%;background:#4ade80;width:0%;transition:width .3s ease}
#boot-hint{font-size:13px;opacity:.7}
#boot-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);color:#ff6b6b;font-family:monospace;font-size:14px;text-align:center;padding:40px;white-space:pre-wrap}
#boot-error.show{display:flex}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="boot">
<div id="boot-title">WebMC</div>
<div id="boot-status">Loading...</div>
<div id="boot-progress"><div></div></div>
<div id="boot-hint"></div>
<div id="boot-error"></div>
</div>
<script src="vfs.js"></script>
<script src="socket.js"></script>
<script src="bootstrap.js"></script>
<script src="game.js"></script>
</body>
</html>
