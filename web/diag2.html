<!DOCTYPE html>
<html>
<head><title>Diag2 - Loading</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;font-size:14px;padding:20px">
<pre id="out"></pre>
<script>
var out = document.getElementById('out');
var lines = [];
function log(msg) { lines.push(msg); out.textContent = lines.join('\n'); document.title = 'D2: ' + lines[lines.length-1]; }

var FBO_COMPLETE = 0x8CD5;
var FBO_INCOMPLETE_ATTACHMENT = 0x8CD6;
var FBO_INCOMPLETE_MISSING_ATTACHMENT = 0x8CD7;
var FBO_INCOMPLETE_DIMENSIONS = 0x8CD0;
var FBO_UNSUPPORTED = 0x8CDD;
var FBO_INCOMPLETE_MULTISAMPLE = 0x8D56;

try {
    var canvas = document.createElement('canvas');
    canvas.width = 1280; canvas.height = 720;
    var gl = canvas.getContext('webgl2');
    log('WebGL2: OK');

    // Test 1: Simple FBO with RGBA8 texture
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    log('Screen cleared to black');

    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1280, 720, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    log('Texture created: 1280x720 RGBA8');

    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    var status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    var statusName = status === FBO_COMPLETE ? 'COMPLETE' :
        status === FBO_INCOMPLETE_ATTACHMENT ? 'INCOMPLETE_ATTACHMENT' :
        status === FBO_INCOMPLETE_MISSING_ATTACHMENT ? 'INCOMPLETE_MISSING_ATTACHMENT' :
        status === FBO_INCOMPLETE_DIMENSIONS ? 'INCOMPLETE_DIMENSIONS' :
        status === FBO_UNSUPPORTED ? 'UNSUPPORTED' :
        status === FBO_INCOMPLETE_MULTISAMPLE ? 'INCOMPLETE_MULTISAMPLE' :
        'UNKNOWN(0x' + status.toString(16) + ')';
    log('FBO status: ' + statusName + ' (0x' + status.toString(16) + ')');

    // Clear FBO to red
    gl.clearColor(1, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    log('FBO cleared to red');

    // Read back FBO pixel
    var pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    log('FBO pixel at (0,0): rgba(' + pixel[0] + ',' + pixel[1] + ',' + pixel[2] + ',' + pixel[3] + ')');

    // Now blit to screen
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    log('Blit setup: READ=FBO, DRAW=default');

    gl.clearColor(0, 0, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    log('Screen cleared to blue (before blit)');

    gl.blitFramebuffer(0, 0, 1280, 720, 0, 0, 1280, 720, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    var err = gl.getError();
    log('blitFramebuffer error: ' + err + (err === 0 ? ' (NONE)' : err === 1282 ? ' (INVALID_OPERATION)' : ''));

    // Read back screen pixel
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    log('Screen pixel at (0,0) after blit: rgba(' + pixel[0] + ',' + pixel[1] + ',' + pixel[2] + ',' + pixel[3] + ')');

    // If red, blit worked! If blue, blit failed!
    if (pixel[0] === 255 && pixel[1] === 0 && pixel[2] === 0) {
        log('SUCCESS: blitFramebuffer works correctly!');
    } else if (pixel[0] === 0 && pixel[1] === 0 && pixel[2] === 255) {
        log('FAIL: blitFramebuffer did nothing (screen still blue)');
    } else {
        log('UNEXPECTED pixel color');
    }

    // Cleanup
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(tex);

    // Test 2: Check if game canvas has WebGL context
    var gameCanvas = document.getElementById('game-canvas');
    if (gameCanvas) {
        log('--- Game Canvas ---');
        log('Game canvas: ' + gameCanvas.width + 'x' + gameCanvas.height);
        var gameCtx = gameCanvas.getContext('webgl2');
        log('Game canvas WebGL2 context: ' + (gameCtx ? 'exists (shared)' : 'null (lost or different context)'));
    } else {
        log('No game-canvas element on this page');
    }

} catch(e) { log('EXCEPTION: ' + e.message); }
document.title = 'Diag2 Done';
</script>
</body>
</html>
