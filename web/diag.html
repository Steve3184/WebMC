<!DOCTYPE html>
<html>
<head><title>WebGL Diagnostic - Loading...</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;font-size:14px;padding:20px">
<pre id="out"></pre>
<script>
var out = document.getElementById('out');
var lines = [];
function log(msg) { lines.push(msg); out.textContent = lines.join('\n'); document.title = 'Diag: ' + lines.length + ' lines'; }

try {
    var canvas = document.createElement('canvas');
    canvas.width = 1280; canvas.height = 720;
    var gl = canvas.getContext('webgl2');

    if (!gl) { log('ERROR: No WebGL2'); } else {
        log('WebGL2 OK');
        log('Renderer: ' + gl.getParameter(gl.RENDERER));
        log('Vendor: ' + gl.getParameter(gl.VENDOR));
        log('MAX_DRAW_BUFFERS: ' + gl.getParameter(gl.MAX_DRAW_BUFFERS));
        log('MAX_COLOR_ATTACHMENTS: ' + gl.getParameter(gl.MAX_COLOR_ATTACHMENTS));
        log('MAX_TEXTURE_SIZE: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
        log('MAX_UNIFORM_BUFFER_BINDINGS: ' + gl.getParameter(gl.MAX_UNIFORM_BUFFER_BINDINGS));
        log('MAX_COMBINED_UNIFORM_BLOCKS: ' + gl.getParameter(gl.MAX_COMBINED_UNIFORM_BLOCKS));
        log('MAX_UNIFORM_BLOCK_SIZE: ' + gl.getParameter(gl.MAX_UNIFORM_BLOCK_SIZE));
        log('MAX_VERTEX_UNIFORM_BLOCKS: ' + gl.getParameter(gl.MAX_VERTEX_UNIFORM_BLOCKS));
        log('MAX_FRAGMENT_UNIFORM_BLOCKS: ' + gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_BLOCKS));

        var vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, '#version 300 es\nin vec4 aPos;\nvoid main() { gl_Position = aPos; }');
        gl.compileShader(vs);
        var vsOk = gl.getShaderParameter(vs, gl.COMPILE_STATUS);
        log('VS compile: ' + (vsOk ? 'OK' : 'FAIL'));

        var fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, '#version 300 es\nprecision mediump float;\nout vec4 fragColor;\nvoid main() { fragColor = vec4(1,0,0,1); }');
        gl.compileShader(fs);
        var fsOk = gl.getShaderParameter(fs, gl.COMPILE_STATUS);
        log('FS compile: ' + (fsOk ? 'OK' : 'FAIL'));

        var prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        var linkOk = gl.getProgramParameter(prog, gl.LINK_STATUS);
        log('Link: ' + (linkOk ? 'OK' : 'FAIL'));

        var fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        var tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1280, 720, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        var status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        log('FBO: ' + (status === 0x8CD5 ? 'COMPLETE' : '0x' + status.toString(16)));

        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.clearColor(1,0,0,1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.blitFramebuffer(0,0,1280,720,0,0,1280,720,gl.COLOR_BUFFER_BIT,gl.NEAREST);
        log('Blit: OK err=' + gl.getError());

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(fbo); gl.deleteTexture(tex);
        gl.deleteProgram(prog); gl.deleteShader(vs); gl.deleteShader(fs);
    }
} catch(e) { log('ERR: ' + e.message); }
document.title = 'Diag Done - ' + lines.length + ' checks';
</script>
</body>
</html>
