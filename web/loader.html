<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMC</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#canvas-container{position:absolute;top:0;left:0;width:100%;height:100%}
#game-canvas{display:block;image-rendering:pixelated}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:monospace;font-size:16px;text-align:center;z-index:10}
</style>
</head>
<body>
<div id="canvas-container"><canvas id="game-canvas"></canvas></div>
<div id="loading">Loading WebMC...<br><span id="progress">Downloading...</span></div>
<script src="vfs.js"></script>
<script src="socket.js"></script>
<script>
(function() {
    var TOTAL_PARTS = 16;
    var loaded = 0;
    var parts = new Array(TOTAL_PARTS);
    var progressEl = document.getElementById('progress');
    var loadingEl = document.getElementById('loading');

    function onPartLoaded(index, text) {
        parts[index] = text;
        loaded++;
        progressEl.textContent = 'Loading part ' + loaded + '/' + TOTAL_PARTS + '...';
        if (loaded === TOTAL_PARTS) {
            progressEl.textContent = 'Executing...';
            loadingEl.style.display = 'none';
            // Execute the combined JS via Blob URL (avoids eval size limits)
            try {
                var fullCode = parts.join('');
                var blob = new Blob([fullCode], { type: 'application/javascript' });
                var url = URL.createObjectURL(blob);
                var script = document.createElement('script');
                script.src = url;
                script.onload = function() {
                    URL.revokeObjectURL(url);
                    console.log('[loader] Game code executed successfully');
                    // TeaVM sets window.main but may not call it automatically
                    if (typeof main === 'function') {
                        console.log('[loader] Calling main()...');
                        try {
                            main();
                        } catch(e) {
                            console.error('[loader] main() error:', e);
                        }
                    } else {
                        console.log('[loader] main is not a function:', typeof main);
                    }
                };
                script.onerror = function(e) {
                    progressEl.textContent = 'Script error: ' + e;
                    loadingEl.style.display = 'block';
                    console.error('[loader] Script error:', e);
                };
                document.head.appendChild(script);
            } catch(e) {
                progressEl.textContent = 'Error: ' + e.message;
                loadingEl.style.display = 'block';
                console.error('[loader] Execution error:', e);
            }
        }
    }

    function loadPart(index) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'parts/part_' + String(index).padStart(3, '0') + '.js', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                onPartLoaded(index, xhr.responseText);
            } else {
                progressEl.textContent = 'Error loading part ' + index + ': HTTP ' + xhr.status;
            }
        };
        xhr.onerror = function() {
            progressEl.textContent = 'Network error loading part ' + index;
        };
        xhr.send();
    }

    // Load all parts (sequentially to avoid overwhelming the server)
    var nextPart = 0;
    function loadNext() {
        if (nextPart < TOTAL_PARTS) {
            loadPart(nextPart);
            nextPart++;
            // Load 4 at a time for parallelism
            if (nextPart % 4 === 0 || nextPart >= TOTAL_PARTS) {
                // Small delay between batches
            }
            setTimeout(loadNext, 10);
        }
    }
    loadNext();
})();
</script>
</body>
</html>
