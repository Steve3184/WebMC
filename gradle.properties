# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# === injected by scripts/apply-patches.sh: relax TLS for slow/weird networks ===
systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
systemProp.jdk.tls.disabledAlgorithms=
systemProp.com.sun.net.ssl.checkRevocation=false
systemProp.jdk.httpclient.allowRestrictedHeaders=connection,content-length,host,upgrade
org.gradle.jvmargs=-Xmx6G -Xss512M -Dhttps.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3 -Djdk.tls.disabledAlgorithms= -Dnet.minecraftforge.gradle.check.certs=false
