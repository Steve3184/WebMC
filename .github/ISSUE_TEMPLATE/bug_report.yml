name: Bug Report
description: Report a bug to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        感谢你报告 bug！请尽可能详细地描述问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      placeholder: 简要描述这个 bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 清晰描述如何复现这个 bug
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - Low (轻微 - 功能部分受损)
        - Medium (中等 - 功能无法使用)
        - High (严重 - 游戏崩溃/无法运行)
        - Critical (致命 - 完全无法使用)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器版本
      placeholder: "Chrome 126, Firefox 128, Safari 17..."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 11, macOS 14, Ubuntu 24.04..."

  - type: input
    id: java
    attributes:
      label: Java 版本
      placeholder: "21, 22..."

  - type: textarea
    id: console
    attributes:
      label: 控制台错误
      description: 浏览器控制台中的完整错误信息
      placeholder: |
        Error: ...
          at Object.<anonymous> (bootstrap.js:123)
          at ...
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: 复现确认
      options:
        - label: 我已确认此问题仍然存在
          required: true
        - label: 我已尝试最新版本
          required: false
