name: Sync Upstream

on:
  schedule:
    # 每周一凌晨 2:00 UTC 自动检查更新
    - cron: '0 2 * * 1'

  workflow_dispatch:
    # 手动触发
    inputs:
      mcp_version:
        description: '指定 MCP-Reborn 版本 (留空使用 latest)'
        required: false
        default: ''

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check MCP-Reborn updates
        id: check
        run: |
          cd work

          # 获取当前版本
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Current MCP-Reborn commit: $CURRENT_COMMIT"

          # 获取远程最新
          git fetch origin

          # 如果指定了版本，使用指定版本
          if [ -n "${{ inputs.mcp_version }}" ]; then
            TARGET="${{ inputs.mcp_version }}"
          else
            # 获取 upstream 最新 commit
            TARGET=$(git rev-parse origin/1.21)
          fi

          echo "Latest upstream commit: $TARGET"
          echo "target_commit=$TARGET" >> $GITHUB_OUTPUT
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          if [ "$CURRENT_COMMIT" != "$TARGET" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
          else
            echo "update_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create update PR if available
        if: steps.check.outputs.update_available == 'true'
        run: |
          cd work

          # 使用 origin/1.21 分支而不是 commit hash
          git fetch origin 1.21:1.21
          git checkout 1.21

          # 导出 patches
          ./gradlew exportPatches || echo "exportPatches failed"

          # 返回主仓库
          cd ..

          # 检查是否有 patches 变更
          if git diff --quiet patches/; then
            echo "No patches changes"
          else
            # 创建分支
            BRANCH_NAME="chore/sync-upstream-$(date +%Y%m%d)"
            git checkout -b "$BRANCH_NAME"
            git add work patches/
            git commit -m "chore(work): sync to MCP Reborn latest"

            # 推送
            git push -u origin "$BRANCH_NAME" || echo "Push failed"

            # 创建 PR
            gh pr create \
              --title "chore: sync MCP-Reborn to latest" \
              --body "自动同步 MCP-Reborn upstream

**当前版本**: \`${{ steps.check.outputs.current_commit }}\`
**最新版本**: \`${{ steps.check.outputs.target_commit }}\`

请审查此更新。" || echo "PR creation failed"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post summary
        run: |
          if [ "${{ steps.check.outputs.update_available }}" == "true" ]; then
            echo "## 📦 Upstream Update Available" >> $GITHUB_STEP_SUMMARY
            echo "- Current: \`${{ steps.check.outputs.current_commit }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Latest: \`${{ steps.check.outputs.target_commit }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ MCP-Reborn is up to date" >> $GITHUB_STEP_SUMMARY
          fi
