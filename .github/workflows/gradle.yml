name: Java CI

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'gradle'

    - name: Copy init script
      run: cp .github/workflows/init.gradle .

    - name: Setup
      env:
        JAVA_OPTS: "-Xmx3g"
        GRADLE_OPTS: "-Xmx3g -XX:+UseSerialGC"
      run: |
        chmod +x gradlew
        # Optimize memory settings for CI with limited RAM (7GB total)
        sed -i 's/org.gradle.jvmargs=-Xmx6G/org.gradle.jvmargs=-Xmx3g -XX:+UseSerialGC/' gradle.properties
        sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
        sed -i 's/org.gradle.configureondemand=true/org.gradle.configureondemand=false/' gradle.properties
        cat gradle.properties
        # Use Aliyun mirror for faster downloads
        ./gradlew setup --no-daemon --init-script init.gradle || \
        ./gradlew setup --no-daemon --init-script init.gradle || \
        ./gradlew setup --no-daemon --init-script init.gradle

    - name: Build with Gradle
      env:
        JAVA_OPTS: "-Xmx3g"
        GRADLE_OPTS: "-Xmx3g -XX:+UseSerialGC"
      run: |
        ./gradlew buildWebRun --no-daemon --init-script init.gradle || \
        ./gradlew buildWebRun --no-daemon --init-script init.gradle || \
        ./gradlew buildWebRun --no-daemon --init-script init.gradle

    - name: Upload WebMC build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: webmc-build
        path: |
          build/web-run/game.js
          build/web-run/game.vfs
          build/web-run/*.br
