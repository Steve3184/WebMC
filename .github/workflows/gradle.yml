name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        path: work

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Setup addons symlinks
      run: |
        mkdir -p work/addons
        ln -sf "$(pwd)/../addons/teavm-runtime" work/addons/ || true
        ln -sf "$(pwd)/../addons/lwjgl-stubs" work/addons/ || true
        ln -sf "$(pwd)/../addons/blaze3d-impl" work/addons/ || true
        ln -sf "$(pwd)/../addons/jdk-stubs" work/addons/ || true
        ln -sf "$(pwd)/../addons/web" work/addons/ || true

    - name: Setup
      working-directory: ./work
      env:
        JAVA_OPTS: "-Xmx3g"
        GRADLE_OPTS: "-Xmx3g -XX:+UseSerialGC"
      run: |
        chmod +x gradlew
        # Optimize memory settings for CI with limited RAM (7GB total)
        sed -i 's/org.gradle.jvmargs=-Xmx6G/org.gradle.jvmargs=-Xmx3g -XX:+UseSerialGC/' gradle.properties
        sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
        sed -i 's/org.gradle.configureondemand=true/org.gradle.configureondemand=false/' gradle.properties
        cat gradle.properties
        ./gradlew setup --no-daemon --no-build-cache

    - name: Build with Gradle
      working-directory: ./work
      env:
        JAVA_OPTS: "-Xmx3g"
        GRADLE_OPTS: "-Xmx3g -XX:+UseSerialGC"
      run: ./gradlew generateJavaScript --no-daemon --no-build-cache

    - name: Upload WebMC build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: webmc-build
        path: |
          work/build/generated/teavm/js/game.js
          work/build/generated/teavm/js/*.wasm
