name: Java CI

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'gradle'

    - name: Copy init script
      run: cp .github/workflows/init.gradle .

    - name: Setup
      env:
        JAVA_TOOL_OPTIONS: "-Xss4m"
        JAVA_OPTS: "-Xmx10g"
        GRADLE_OPTS: "-Xmx10g -XX:+UseSerialGC -XX:+AlwaysPreTouch"
      run: |
        chmod +x gradlew
        # Optimize memory settings for CI - disable parallel and incremental
        sed -i 's/org.gradle.jvmargs=-Xmx6G/org.gradle.jvmargs=-Xmx10g -XX:+UseSerialGC -XX:+AlwaysPreTouch/' gradle.properties
        sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
        sed -i 's/org.gradle.configureondemand=true/org.gradle.configureondemand=false/' gradle.properties
        sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
        cat gradle.properties
        # Use Aliyun mirror for faster downloads with retry
        for i in 1 2 3; do
          ./gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache --no-incremental && break
          echo "Retry $i failed, waiting 30s..."
          sleep 30
        done

    - name: Build with Gradle
      env:
        JAVA_TOOL_OPTIONS: "-Xss4m"
        JAVA_OPTS: "-Xmx10g"
        GRADLE_OPTS: "-Xmx10g -XX:+UseSerialGC -XX:+AlwaysPreTouch"
      run: |
        ./gradlew buildWebRun --no-daemon --init-script init.gradle --no-configuration-cache --no-incremental

    - name: Upload WebMC build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: webmc-build
        path: |
          build/web-run/game.js
          build/web-run/game.vfs
          build/web-run/*.br
