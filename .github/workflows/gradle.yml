name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        path: work

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Setup addons symlinks
      run: |
        mkdir -p work/addons
        ln -sf "$(pwd)/../addons/teavm-runtime" work/addons/ || true
        ln -sf "$(pwd)/../addons/lwjgl-stubs" work/addons/ || true
        ln -sf "$(pwd)/../addons/blaze3d-impl" work/addons/ || true
        ln -sf "$(pwd)/../addons/jdk-stubs" work/addons/ || true
        ln -sf "$(pwd)/../addons/web" work/addons/ || true

    - name: Setup
      working-directory: ./work
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
      run: chmod +x gradlew && ./gradlew setup --no-configuration-cache --no-build-cache --no-daemon --refresh-dependencies

    - name: Build with Gradle
      working-directory: ./work
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
      run: chmod +x gradlew && ./gradlew generateJavaScript --no-configuration-cache --no-build-cache --no-daemon --refresh-dependencies

    - name: Upload WebMC build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: webmc-build
        path: |
          work/build/generated/teavm/js/game.js
          work/build/generated/teavm/js/*.wasm
