name: Build

on:
  push:
    branches: [main, security/input-validation-fixes]
  pull_request:
    branches: [main, security/input-validation-fixes]
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: -Xss64m
  GRADLE_OPTS: -Xmx14g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Copy init script
        run: cp .github/workflows/init.gradle .

      - name: Setup Gradle
        run: |
          chmod +x work/gradlew
          # Set CI-optimized memory settings
          cat > work/gradle.properties << 'EOF'
# CI-optimized settings
org.gradle.jvmargs=-Xmx14g -Xss64m -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false
EOF
          # Add compileJava memory args
          mkdir -p work/gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> work/gradle/gradle.properties
          # Download Minecraft assets and setup work/
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache

      - name: Build WebRun
        run: |
          export GRADLE_OPTS="-Xmx14g -Xss64m -XX:+UseG1GC -Dorg.gradle.jvmargs=-Xmx14g"
          ./work/gradlew generateJavaScript --no-daemon --init-script init.gradle --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx14g" \
            -Dorg.gradle.workers.max=1 \
            -Dkotlin.daemon.jvmargs="-Xmx14g" 2>&1
