name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_TOOL_OPTIONS: -Xss32m
  GRADLE_OPTS: -Xmx8g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .gitmodules
        run: |
          cat << 'EOF' > .gitmodules
          [submodule "work"]
            path = work
            active = true
            url = https://github.com/Hexeption/MCP-Reborn.git
            branch = 1.21
          EOF

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Setup addons for work submodule
        run: |
          # work/addons is a symlink/copy of the main repo's addons/
          if [ ! -d "work/addons/teavm-runtime" ]; then
            cp -r addons work/addons
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        working-directory: ./work
        run: chmod +x gradlew && ./gradlew setup --no-daemon

      - name: Build with TeaVM (phase197:build)
        working-directory: ./work
        run: ./gradlew phase197:build --no-daemon 2>&1

      - name: Check game.js size
        run: |
          SIZE=$(stat -c%s work/build/web-run/game.js 2>/dev/null || stat -f%z work/build/web-run/game.js)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "game.js size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 350 ]; then
            echo "::warning::game.js exceeds 350MB limit (${SIZE_MB}MB)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-run-artifacts
          path: work/build/web-run/
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .gitmodules
        run: |
          cat << 'EOF' > .gitmodules
          [submodule "work"]
            path = work
            active = true
            url = https://github.com/Hexeption/MCP-Reborn.git
            branch = 1.21
          EOF

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-run-artifacts
          path: web-run

      - name: Verify artifacts
        run: |
          echo "Verifying build artifacts..."
          ls -lh web-run/
          echo "--- game.js check ---"
          if [ -f "web-run/game.js" ]; then
            SIZE=$(stat -c%s web-run/game.js 2>/dev/null || stat -f%z web-run/game.js)
            echo "game.js exists: $((SIZE / 1024 / 1024))MB"
          fi
          echo "--- game.vfs check ---"
          if [ -f "web-run/game.vfs" ]; then
            SIZE=$(stat -c%s web-run/game.vfs 2>/dev/null || stat -f%z web-run/game.vfs)
            echo "game.vfs exists: $((SIZE / 1024 / 1024))MB"
          fi
          echo "--- index.html check ---"
          if [ -f "web-run/index.html" ]; then
            echo "index.html exists"
          fi
