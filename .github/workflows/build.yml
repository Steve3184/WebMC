name: Build

on:
  push:
    branches: [main, 'security/*']
  pull_request:
    branches: [main, 'security/*']
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: -Xss64m
  GRADLE_OPTS: -Xmx14g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Copy init script
        run: cp .github/workflows/init.gradle .

      - name: Setup Gradle
        run: |
          chmod +x gradlew
          # Set CI-optimized memory settings
          cat > gradle.properties << 'EOF'
# CI-optimized settings
org.gradle.jvmargs=-Xmx14g -Xss64m -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false
EOF
          # Download Minecraft assets and setup work/
          ./gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache

      - name: Build with Gradle (TeaVM)
        run: |
          export GRADLE_OPTS="-Xmx14g -Xss64m -XX:+UseG1GC -Dorg.gradle.jvmargs=-Xmx14g"
          ./gradlew compileTeavmJava generateJavaScript --no-daemon --init-script init.gradle --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx14g" \
            -Dorg.gradle.workers.max=1 \
            -Dkotlin.daemon.jvmargs="-Xmx14g" 2>&1

      - name: Check build output
        run: |
          if [ -f "build/web-run/game.js" ]; then
            SIZE=$(stat -c%s build/web-run/game.js 2>/dev/null || stat -f%z build/web-run/game.js)
            echo "game.js size: $((SIZE / 1024 / 1024))MB"
          else
            echo "No game.js found in build/web-run/"
            find build -name "*.js" -type f 2>/dev/null | head -5 || echo "No JS files found"
          fi

      - name: Upload WebMC build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webmc-build
          path: |
            build/web-run/game.js
            build/web-run/game.vfs
            build/web-run/*.br
          retention-days: 7
