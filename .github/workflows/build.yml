name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_TOOL_OPTIONS: -Xss64m
  GRADLE_OPTS: -Xmx12g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Copy init script
        run: cp .github/workflows/init.gradle .

      - name: Setup Gradle
        run: |
          chmod +x work/gradlew
          # Set CI-optimized memory settings directly in gradle.properties
          sed -i 's/org.gradle.jvmargs=-Xmx6G/org.gradle.jvmargs=-Xmx12g -Xss64m -XX:+UseG1GC/' work/gradle.properties
          sed -i 's/org.gradle.workers.max=4/org.gradle.workers.max=2/' work/gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' work/gradle.properties
          # Download Minecraft assets and setup work/
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache || \
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache || \
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache
        continue-on-error: true

      - name: Build WebRun
        run: |
          ./work/gradlew generateJavaScript --no-daemon --init-script init.gradle --no-configuration-cache 2>&1
