name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_TOOL_OPTIONS: -Xss32m
  GRADLE_OPTS: -Xmx8g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .gitmodules
        run: |
          cat << 'EOF' > .gitmodules
          [submodule "work"]
            path = work
            active = true
            url = https://github.com/Hexeption/MCP-Reborn.git
            branch = 1.21
          EOF

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('work/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup addons for work submodule
        run: |
          # Create addons symlink in work directory pointing to project root
          mkdir -p work/addons
          if [ ! -L "work/addons/teavm-runtime" ]; then
            ln -sf "$(pwd)/addons/teavm-runtime" work/addons/teavm-runtime
          fi
          if [ ! -L "work/addons/lwjgl-stubs" ]; then
            ln -sf "$(pwd)/addons/lwjgl-stubs" work/addons/lwjgl-stubs
          fi
          if [ ! -L "work/addons/blaze3d-impl" ]; then
            ln -sf "$(pwd)/addons/blaze3d-impl" work/addons/blaze3d-impl
          fi
          if [ ! -L "work/addons/jdk-stubs" ]; then
            ln -sf "$(pwd)/addons/jdk-stubs" work/addons/jdk-stubs
          fi
          if [ ! -L "work/addons/web" ]; then
            ln -sf "$(pwd)/addons/web" work/addons/web
          fi

      - name: Setup Gradle (download assets)
        working-directory: ./work
        run: |
          chmod +x gradlew
          ./gradlew setup --no-daemon || ./gradlew setup --no-daemon || ./gradlew setup --no-daemon
        continue-on-error: true

      - name: Apply patches
        run: |
          chmod +x scripts/apply-patches.sh
          bash scripts/apply-patches.sh

      - name: Build TeaVM with Gradle
        working-directory: ./work
        run: ./gradlew generateJavaScript --no-daemon 2>&1

      - name: Export patches
        run: |
          chmod +x scripts/rebuild-patches.sh
          bash scripts/rebuild-patches.sh

      - name: Check game.js size
        run: |
          SIZE=$(stat -c%s work/build/generated/teavm/js/game.js 2>/dev/null || stat -f%z work/build/generated/teavm/js/game.js 2>/dev/null || echo "0")
          if [ "$SIZE" -gt "0" ]; then
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "game.js size: ${SIZE_MB}MB"
            if [ "$SIZE_MB" -gt 350 ]; then
              echo "::warning::game.js exceeds 350MB limit (${SIZE_MB}MB)"
            fi
          else
            echo "No game.js found, checking for other artifacts..."
            find work/build -name "*.js" -type f 2>/dev/null | head -5
          fi

      - name: Upload patches
        uses: actions/upload-artifact@v4
        with:
          name: patches
          path: patches/
          retention-days: 1

      - name: Upload WebMC build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webmc-build
          path: |
            work/build/generated/teavm/js/game.js
            work/build/generated/teavm/js/*.wasm
            index.html
            bootstrap.js
            addons/web/*.js
            addons/teavm-runtime/src/main/resources/**/*
