name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_TOOL_OPTIONS: -Xss64m
  GRADLE_OPTS: -Xmx14g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Copy init script
        run: cp .github/workflows/init.gradle .

      - name: Setup Gradle
        run: |
          chmod +x work/gradlew
          # Set CI-optimized memory settings
          cat > work/gradle.properties << 'EOF'
# CI-optimized settings
org.gradle.jvmargs=-Xmx14g -Xss64m -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false
EOF
          # Download Minecraft assets and setup work/
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache || \
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache || \
          ./work/gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache
        continue-on-error: true

      - name: Build WebRun
        run: |
          ./work/gradlew generateJavaScript --no-daemon --init-script init.gradle --no-configuration-cache 2>&1
