name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: -Xss64m
  GRADLE_OPTS: -Xmx14g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Copy init script
        run: cp .github/workflows/init.gradle .

      - name: Setup Gradle
        run: |
          chmod +x gradlew
          # Set CI-optimized memory settings
          echo '# CI-optimized settings' > gradle.properties
          echo 'org.gradle.jvmargs=-Xmx14g -Xss64m -XX:+UseG1GC' >> gradle.properties
          echo 'org.gradle.daemon=false' >> gradle.properties
          echo 'org.gradle.parallel=false' >> gradle.properties
          echo 'org.gradle.workers.max=1' >> gradle.properties
          echo 'org.gradle.configureondemand=false' >> gradle.properties
          # Download Minecraft assets and setup work/
          ./gradlew setup --no-daemon --init-script init.gradle --no-configuration-cache

      - name: Build with Gradle (TeaVM)
        run: |
          export GRADLE_OPTS="-Xmx14g -Xss64m -XX:+UseG1GC -Dorg.gradle.jvmargs=-Xmx14g"
          ./gradlew generateJavaScript --no-daemon --init-script init.gradle --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx14g" \
            -Dorg.gradle.workers.max=1 \
            -Dkotlin.daemon.jvmargs="-Xmx14g" 2>&1

      - name: Copy TeaVM output to web-run
        run: |
          mkdir -p build/web-run
          cp -r build/generated/teavm/js/* build/web-run/
          # Copy VFS resources - CRITICAL for game to run
          cp -f addons/web/game.vfs build/web-run/
          # Copy all necessary frontend files from addons/web/
          cp -f addons/web/index.html build/web-run/
          cp -f addons/web/bootstrap.js build/web-run/
          cp -f addons/web/vfs.js build/web-run/
          cp -f addons/web/socket.js build/web-run/
          cp -f addons/web/performance.js build/web-run/
          cp -f addons/web/performance-hud.js build/web-run/
          cp -f addons/web/diagnostics.js build/web-run/
          cp -f addons/web/mcperf.js build/web-run/
          cp -f addons/web/input-bridge.js build/web-run/
          # Copy favicon
          cp -f addons/web/favicon.ico build/web-run/ 2>/dev/null || true
          # Wait for file to be fully written
          sync
          sleep 2
          ls -la build/web-run/
        id: build

      - name: Check build output
        run: |
          if [ -f "build/web-run/game.js" ]; then
            # Use stat instead of wc to get file size (more reliable)
            SIZE=$(stat -c%s build/web-run/game.js 2>/dev/null || stat -f%z build/web-run/game.js 2>/dev/null)
            if [ "$SIZE" -gt 1000 ]; then
              echo "game.js size: $((SIZE / 1024))KB ($SIZE bytes)"
              echo "build_result=success" >> $GITHUB_OUTPUT
              echo "build_size=$((SIZE / 1024))" >> $GITHUB_OUTPUT
            else
              echo "game.js is too small: $SIZE bytes"
              echo "build_result=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "No game.js found in build/web-run/"
            find build -name "*.js" -type f 2>/dev/null | head -5 || echo "No JS files found"
            echo "build_result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload WebMC build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webmc-build-${{ github.run_id }}
          path: |
            build/web-run/game.js
            build/web-run/game.vfs
            build/web-run/index.html
            build/web-run/favicon.ico
            build/web-run/bootstrap.js
            build/web-run/vfs.js
            build/web-run/socket.js
            build/web-run/performance.js
            build/web-run/performance-hud.js
            build/web-run/*.br
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

