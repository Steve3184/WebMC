name: Release

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_TOOL_OPTIONS: -Xss32m
  GRADLE_OPTS: -Xmx8g -XX:+UseG1GC

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        working-directory: ./work
        run: chmod +x gradlew && ./gradlew setup --no-daemon

      - name: Build with TeaVM
        working-directory: ./work
        run: ./gradlew phase197:build --no-daemon 2>&1

      - name: Install Brotli
        run: |
          sudo apt-get update && sudo apt-get install -y brotli

      - name: Create Brotli compressed assets
        working-directory: ./work/build/web-run
        run: |
          echo "Compressing game.js with Brotli..."
          brotli -f -o game.js.br game.js

          echo "Compressing game.vfs with Brotli..."
          brotli -f -o game.vfs.br game.vfs

          echo "Compression complete. Sizes:"
          ls -lh *.br 2>/dev/null || echo "No .br files found"

      - name: Generate checksums
        working-directory: ./work/build/web-run
        run: |
          echo "Generating checksums..."
          sha256sum game.js game.js.br game.vfs game.vfs.br index.html bootstrap.js > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            work/build/web-run/game.js
            work/build/web-run/game.js.br
            work/build/web-run/game.vfs
            work/build/web-run/game.vfs.br
            work/build/web-run/index.html
            work/build/web-run/bootstrap.js
            work/build/web-run/vfs-loader.js
            work/build/web-run/vfs-cache.js
            work/build/web-run/game_head.js
            work/build/web-run/SHA256SUMS.txt
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            work/build/web-run/game.js
            work/build/web-run/game.js.br
            work/build/web-run/game.vfs
            work/build/web-run/game.vfs.br
            work/build/web-run/index.html
            work/build/web-run/bootstrap.js
            work/build/web-run/vfs-loader.js
            work/build/web-run/vfs-cache.js
            work/build/web-run/game_head.js
            work/build/web-run/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  size-check:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-run-artifacts
          path: web-run

      - name: Size report
        run: |
          echo "=== Release Size Report ==="
          echo ""
          echo "game.js:"
          ls -lh web-run/game.js 2>/dev/null || echo "Not found"
          echo ""
          echo "game.js.br:"
          ls -lh web-run/game.js.br 2>/dev/null || echo "Not found"
          echo ""
          echo "game.vfs:"
          ls -lh web-run/game.vfs 2>/dev/null || echo "Not found"
          echo ""
          echo "game.vfs.br:"
          ls -lh web-run/game.vfs.br 2>/dev/null || echo "Not found"
