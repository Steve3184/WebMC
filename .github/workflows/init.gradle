allprojects {
    repositories {
        // Minecraft 和 Mojang 官方仓库
        maven { url 'https://libraries.minecraft.net' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url 'https://maven.minecraftforge.net' }
        // 阿里云镜像（国内加速）
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        // 标准仓库
        mavenCentral()
        gradlePluginPortal()
    }
}

settingsEvaluated { settings ->
    settings.pluginManagement {
        repositories {
            maven { url 'https://maven.neoforged.net/releases' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            mavenCentral()
            gradlePluginPortal()
        }
    }
}

// CI: Disable fork for compilation tasks (Windows worker ClassNotFoundException workaround)
// Note: Fork is already disabled in build.gradle for JDK stubs compilation tasks
allprojects {
    tasks.withType(JavaCompile).configureEach {
        // Let the build.gradle settings control fork behavior
        // CI can override this via environment variables
        if (System.getenv('CI') == 'true') {
            options.fork = false
            options.incremental = true
        }
    }
}
